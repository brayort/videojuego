<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Director UAN</title>
<style>
@font-face { font-family: "Lora"; src: url("/assets/fonts/Lora.ttf"); }
@font-face { font-family: "Bebas"; src: url("/assets/fonts/BebasNeue-Regular.ttf"); }
:root {
  --guinda: #6B1D2A; --guinda-osc: #3A0F18; --vino: #8E2B3B; --dorado: #D4A63A; --dorado-cl: #F0D58A;
  --crema: #F5ECD6; --crema-osc: #E2D2AC; --tinta: #2B1B1F; --azul: #1F3A5F; --azul-cl: #3E6296;
  --verde: #3E8E5A; --rojo: #B3372F; --ambar: #C98A1B; --gris: #8A7F78; --negro: #140A0D;
  --bg: #1c0c11; --panel: #2a1218; --panel2: #34161e; --linea: #4a2430; --txt: var(--crema); --txt2: #c9b99a; --txt3: #8f7f6c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--txt); font: 14px/1.45 "Lora", Georgia, serif; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--guinda); border: 1px solid var(--dorado); color: var(--crema); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
button:hover { background: var(--vino); }
button.sec { background: transparent; border-color: var(--linea); color: var(--txt2); }
button.sec:hover { border-color: var(--dorado); color: var(--crema); }
button.peligro { border-color: var(--rojo); background: transparent; color: #f0a49d; }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { background: var(--negro); border: 1px solid var(--linea); border-radius: 5px; padding: 5px 7px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--dorado); }
textarea { resize: vertical; min-height: 60px; }
textarea.json { font: 12px/1.4 Consolas, monospace; min-height: 46px; }
label { display: block; font-size: 12px; color: var(--txt2); margin: 8px 0 3px; }
h1, h2, h3 { font-family: "Bebas", Impact, sans-serif; font-weight: normal; letter-spacing: .5px; margin: 0; color: var(--dorado-cl); }
h2 { font-size: 22px; } h3 { font-size: 18px; margin: 14px 0 6px; }
header { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--guinda-osc); border-bottom: 2px solid var(--dorado); }
header h1 { font-size: 26px; color: var(--crema); }
nav { display: flex; gap: 4px; }
nav button { background: transparent; border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 14px 10px 11px; color: var(--txt2); }
nav button.on { color: var(--dorado-cl); border-bottom-color: var(--dorado); }
nav button:hover { background: transparent; color: var(--crema); }
.esp { flex: 1; }
#estado { font-size: 12px; color: var(--txt3); }
#estado.sucio { color: var(--ambar); }
main { height: calc(100% - 52px); }
.tab { display: none; height: 100%; }
.tab.on { display: grid; }
.col { overflow: auto; padding: 14px; border-right: 1px solid var(--linea); min-width: 0; }
.col:last-child { border-right: 0; }
#tCartas, #tCine { grid-template-columns: 300px minmax(380px, 1fr) 400px; }
#tBalance, #tLint { display: none; }
#tBalance.on, #tLint.on { display: block; overflow: auto; padding: 18px 22px; }
.lista { list-style: none; margin: 8px 0 0; padding: 0; }
.lista li { padding: 7px 9px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
.lista li:hover { background: var(--panel); }
.lista li.on { background: var(--panel2); border-color: var(--dorado); }
.lista .id { font: 12px Consolas, monospace; color: var(--dorado-cl); }
.lista .pj { font-size: 11px; color: var(--txt3); float: right; }
.lista .ex { font-size: 12px; color: var(--txt2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font: 11px/18px Consolas, monospace; text-align: center; margin-left: 4px; }
.b-error { background: var(--rojo); color: #fff; } .b-aviso { background: var(--ambar); color: var(--tinta); } .b-info { background: var(--azul); color: var(--crema); }
.filtros { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 12px; border: 1px solid var(--linea); cursor: pointer; color: var(--txt2); user-select: none; }
.chip.on { border-color: var(--dorado); color: var(--dorado-cl); background: var(--panel2); }
.fila { display: flex; gap: 8px; align-items: end; }
.fila > * { flex: 1; min-width: 0; }
.fila > .angosto { flex: 0 0 90px; }
.op { border: 1px solid var(--linea); border-radius: 8px; padding: 4px 12px 12px; margin-top: 12px; background: var(--panel); }
.op h3 { display: flex; align-items: center; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats input { text-align: center; }
.stats input.pos { border-color: var(--verde); } .stats input.neg { border-color: var(--rojo); }
.msgs { margin-top: 10px; }
.msg { font-size: 12px; padding: 5px 8px; border-left: 3px solid; margin-bottom: 4px; background: var(--panel); border-radius: 0 4px 4px 0; cursor: pointer; }
.msg.error { border-color: var(--rojo); } .msg.aviso { border-color: var(--ambar); } .msg.info { border-color: var(--azul-cl); color: var(--txt2); }
.refs a { color: var(--dorado-cl); cursor: pointer; text-decoration: underline dotted; font: 12px Consolas, monospace; margin-right: 8px; }
.refs { font-size: 12px; color: var(--txt2); margin-top: 4px; }
.cnt { font-size: 11px; color: var(--txt3); float: right; }
.cnt.mal { color: var(--ambar); }
.barra-herr { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
/* ---- telefono de vista previa (720x1280 a escala) ---- */
.tel { position: relative; width: 360px; height: 640px; margin: 0 auto; overflow: hidden; border-radius: 18px; box-shadow: 0 0 0 6px #000, 0 0 0 8px var(--linea); background: #000; }
.tel .lienzo { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; transform: scale(.5); transform-origin: 0 0; }
.lienzo .abs { position: absolute; }
.lienzo img { position: absolute; }
.tel-ctrl { display: flex; justify-content: center; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
.tel-ctrl button.on { background: var(--vino); border-color: var(--dorado-cl); }
.ind { position: absolute; width: 96px; height: 96px; border: 4px solid var(--vino); background: var(--negro); }
.ind .f { position: absolute; left: 0; right: 0; bottom: 0; background: var(--dorado); }
.ind img { position: relative; left: 20px; top: 20px; width: 48px; height: 48px; }
.ind.toca { border-color: var(--dorado-cl); }
.ind .d { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); font: 28px "Bebas"; }
.ttl { font-family: "Bebas"; } .lora { font-family: "Lora"; }
/* ---- balance ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 12px 0 18px; }
.kpi { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 14px; }
.kpi .v { font: 34px/1 "Bebas"; color: var(--crema); margin-top: 4px; }
.kpi .l { font-size: 12px; color: var(--txt2); }
.kpi .o { font-size: 11px; color: var(--txt3); }
.kpi .o.ok { color: #8fd0a4; } .kpi .o.mal { color: #f0a49d; }
.graf { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.caja { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 12px 16px 14px; min-width: 0; }
.caja h3 { margin-top: 0; }
.caja .nota { font-size: 12px; color: var(--txt3); margin: -2px 0 8px; }
.hb { display: grid; grid-template-columns: 130px 1fr 52px; gap: 6px; align-items: center; font-size: 12px; margin-bottom: 3px; }
.hb .n { color: var(--txt2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .t { height: 14px; position: relative; }
.hb .t i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--dorado); border-radius: 0 4px 4px 0; }
.hb:hover .t i { background: var(--dorado-cl); }
.hb .p { text-align: right; color: var(--txt); font-variant-numeric: tabular-nums; }
.histo { display: flex; align-items: flex-end; gap: 2px; height: 160px; border-bottom: 1px solid var(--linea); }
.histo div { flex: 1; background: var(--dorado); border-radius: 4px 4px 0 0; min-height: 1px; }
.histo div:hover { background: var(--dorado-cl); }
.ejex { display: flex; justify-content: space-between; font-size: 11px; color: var(--txt3); margin-top: 3px; }
.ids { font: 12px/1.9 Consolas, monospace; }
.ids a { color: var(--dorado-cl); cursor: pointer; margin-right: 10px; white-space: nowrap; }
#tip { position: fixed; pointer-events: none; background: var(--negro); border: 1px solid var(--dorado); padding: 5px 9px; border-radius: 5px; font-size: 12px; display: none; z-index: 99; max-width: 320px; }
.vacio { color: var(--txt3); font-style: italic; padding: 20px 0; }
.lin { border: 1px solid var(--linea); border-radius: 8px; padding: 2px 10px 10px; margin-bottom: 8px; background: var(--panel); }
.lin.on { border-color: var(--dorado); }
.lin .cab { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.lin .cab .num { font: 18px "Bebas"; color: var(--txt3); width: 26px; }
.lin .cab select { width: auto; }
.mini { padding: 3px 8px; font-size: 12px; }
table.disp { width: 100%; border-collapse: collapse; font-size: 12px; }
table.disp td { padding: 3px 2px; }
</style>
</head>
<body>
<header>
  <h1>DIRECTOR UAN · EDITOR</h1>
  <nav id="nav">
    <button data-t="tCartas" class="on">Cartas</button>
    <button data-t="tCine">Cinemáticas</button>
    <button data-t="tBalance">Balance</button>
    <button data-t="tLint">Revisión <span id="lintBadge"></span></button>
  </nav>
  <div class="esp"></div>
  <span id="estado">cargando…</span>
  <button id="bGuardar" disabled>Guardar</button>
  <button id="bBuild" class="sec" title="node tools/build/build.js + assets.js (cierra GDevelop antes)">Build game.json</button>
</header>
<main>
  <!-- ================= CARTAS ================= -->
  <section class="tab on" id="tCartas">
    <div class="col">
      <input id="cBuscar" placeholder="Buscar id, texto, opción, bandera…">
      <div class="fila" style="margin-top:6px">
        <select id="cPj"><option value="">Todos los personajes</option></select>
      </div>
      <div class="filtros" id="cFiltros">
        <span class="chip" data-f="problemas">con problemas</span>
        <span class="chip" data-f="solo_luego">solo_luego</span>
        <span class="chip" data-f="campana">campaña</span>
        <span class="chip" data-f="era">con era</span>
        <span class="chip" data-f="cine">con cine</span>
        <span class="chip" data-f="nunca">nunca vista</span>
      </div>
      <div class="barra-herr"><button id="cNueva" class="mini">+ Nueva</button><button id="cDup" class="mini sec">Duplicar</button><button id="cBorrar" class="mini peligro">Borrar</button><span class="esp"></span><span id="cCuenta" class="cnt"></span></div>
      <ul class="lista" id="cLista"></ul>
    </div>
    <div class="col" id="cForm"></div>
    <div class="col">
      <div class="tel"><div class="lienzo" id="cTel"></div></div>
      <div class="tel-ctrl" id="cTelCtrl">
        <button data-v="">Carta</button><button data-v="izq">◀ Izquierda</button><button data-v="der">Derecha ▶</button><button data-v="arriba">▲ Expediente</button>
      </div>
      <div id="cInfo" class="refs"></div>
    </div>
  </section>
  <!-- ================= CINEMATICAS ================= -->
  <section class="tab" id="tCine">
    <div class="col">
      <div class="barra-herr"><button id="nNueva" class="mini">+ Nueva</button><button id="nDup" class="mini sec">Duplicar</button><button id="nBorrar" class="mini peligro">Borrar</button></div>
      <ul class="lista" id="nLista"></ul>
      <h3>Disparos</h3>
      <div class="nota" style="font-size:12px;color:var(--txt3)">Evento del motor → cinemática. Las cartas y opciones usan <code>"cine"</code>.</div>
      <table class="disp" id="nDisp"></table>
      <button id="nDispAdd" class="mini sec" style="margin-top:6px">+ Disparo</button>
    </div>
    <div class="col" id="nForm"></div>
    <div class="col">
      <div class="tel" id="nTelMarco"><div class="lienzo" id="nTel"></div></div>
      <div class="tel-ctrl">
        <button id="nPlay">▶ Reproducir</button><button id="nDesde" class="sec">▶ Desde la línea</button><button id="nSonido" class="sec">♪ Música: no</button>
      </div>
      <div class="refs">Clic sobre el teléfono = avanzar (como en el juego). Esc = saltar.</div>
    </div>
  </section>
  <!-- ================= BALANCE ================= -->
  <section class="tab" id="tBalance">
    <div class="fila" style="max-width:900px">
      <div><label>Bot</label><select id="bBot"></select></div>
      <div class="angosto" style="flex:0 0 170px"><label>Partidas por bot</label><select id="bN"><option value="300">300 (≈15 s)</option><option value="1000">1000 (≈45 s)</option><option value="5000">5000 · oficial (≈3 min)</option></select></div>
      <div style="flex:0 0 auto"><button id="bCorrer">Correr simulación</button></div>
      <div style="flex:0 0 auto"><button id="bSim" class="sec" title="tools/sim/sim.js: prueba de regresión de escenas">Prueba de escenas</button></div>
    </div>
    <div id="bOut"></div>
  </section>
  <!-- ================= LINT ================= -->
  <section class="tab" id="tLint">
    <div class="filtros" id="lFiltros"><span class="chip on" data-n="error">errores</span><span class="chip on" data-n="aviso">avisos</span><span class="chip" data-n="info">info</span></div>
    <div id="lOut" class="msgs"></div>
  </section>
</main>
<div id="tip"></div>
<script>
"use strict";
// ======================= estado =======================
let D, CI, LAY, AUD, AS, BAL, LINT = [];
const sucio = { cartas: false, cinematicas: false };
let selC = 0, selN = null, selLin = 0, vistaOp = "";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const h = (tag, attrs, ...hijos) => { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === "on") for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); else if (k === "html") e.innerHTML = attrs[k]; else if (attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) e.setAttribute(k, attrs[k]); } hijos.flat().forEach(x => { if (x !== null && x !== undefined && x !== false) e.append(x.nodeType ? x : String(x)); }); return e; };
const api = async (ruta, cuerpo) => { const r = await fetch(ruta, cuerpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) } : undefined); const j = await r.json(); if (j && j.error) throw new Error(j.error); return j; };
const COL = { guinda: "#6B1D2A", guinda_osc: "#3A0F18", vino: "#8E2B3B", dorado: "#D4A63A", dorado_claro: "#F0D58A", crema: "#F5ECD6", crema_osc: "#E2D2AC", tinta: "#2B1B1F", azul: "#1F3A5F", azul_cl: "#3E6296", verde: "#3E8E5A", rojo: "#B3372F", ambar: "#C98A1B", gris: "#8A7F78", negro: "#140A0D", blanco: "#FFFFFF" };
const STATN = ["Académico", "Estudiantes", "Finanzas", "Política"], STATI = ["academico", "estudiantes", "finanzas", "politica"];
const EJ = { n: 3, ant: "Mtra. Quintero", causa: "perdió la elección", antsem: 61, dir: "Dr. Fausto Meléndez", ex: "Mtra. Quintero", jugador: "Héctor", evento: "" };
const fmt = s => String(s || "").replace(/\{(\w+)\}/g, (m, k) => (EJ[k] !== undefined ? EJ[k] : m));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tip = $("#tip");
document.addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]"); if (!t) { tip.style.display = "none"; return; } tip.innerHTML = t.dataset.tip; tip.style.display = "block"; tip.style.left = Math.min(innerWidth - 330, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; });

function marcar(arch) { sucio[arch] = true; estado(); lintPronto(); }
function estado() {
  const s = Object.keys(sucio).filter(k => sucio[k]);
  $("#estado").textContent = s.length ? "sin guardar: " + s.join(", ") : "todo guardado";
  $("#estado").className = s.length ? "sucio" : ""; $("#bGuardar").disabled = !s.length;
}
window.addEventListener("beforeunload", e => { if (sucio.cartas || sucio.cinematicas) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); guardar(); } });

// ======================= lint =======================
let lintT = 0;
function lintPronto() { clearTimeout(lintT); lintT = setTimeout(correrLint, 400); }
async function correrLint() {
  try { LINT = await api("/api/lint", { cartas: D, cinematicas: CI }); } catch (e) { LINT = [{ nivel: "error", donde: "editor", msg: "JSON invalido: " + e.message }]; }
  const n = LINT.filter(x => x.nivel === "error").length, a = LINT.filter(x => x.nivel === "aviso").length;
  $("#lintBadge").innerHTML = n ? `<span class="badge b-error">${n}</span>` : a ? `<span class="badge b-aviso">${a}</span>` : "";
  pintarListaC(); pintarMsgsC(); pintarListaN(); pintarLint();
}
const deCarta = id => LINT.filter(x => x.donde === "carta " + id || x.donde.indexOf("carta " + id + ".") === 0);
const deCine = id => LINT.filter(x => x.donde === "cine " + id || x.donde.indexOf("cine " + id + " ") === 0);
function irA(donde) {
  let m = /^carta ([^.\s]+)/.exec(donde);
  if (m) { const i = D.cartas.findIndex(c => c.id === m[1]); if (i >= 0) { tab("tCartas"); selC = i; pintarTodoC(true); } return; }
  m = /^cine (\S+)(?: linea (\d+))?/.exec(donde);
  if (m) { tab("tCine"); selN = m[1]; selLin = m[2] ? +m[2] - 1 : 0; pintarTodoN(); }
}
function pintarLint() {
  const nv = $$("#lFiltros .chip.on").map(c => c.dataset.n);
  const l = LINT.filter(x => nv.includes(x.nivel)), out = $("#lOut"); out.innerHTML = "";
  out.append(h("h2", null, "Revisión de contenido"), h("div", { class: "refs" }, `${LINT.filter(x => x.nivel === "error").length} errores · ${LINT.filter(x => x.nivel === "aviso").length} avisos · ${LINT.filter(x => x.nivel === "info").length} info — misma regla que npm run lint`));
  if (!l.length) out.append(h("div", { class: "vacio" }, "Nada que reportar."));
  l.forEach(x => out.append(h("div", { class: "msg " + x.nivel, on: { click: () => irA(x.donde) } }, h("b", null, x.donde), " — ", x.msg)));
}
$("#lFiltros").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { c.classList.toggle("on"); pintarLint(); } });

// ======================= tabs, guardar, build =======================
function tab(id) { $$("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t === id)); $$(".tab").forEach(t => t.classList.toggle("on", t.id === id)); if (id === "tBalance") pintarBalance(); if (id !== "tCine") pararCine(); }
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) tab(b.dataset.t); });
async function guardar() {
  const errs = LINT.filter(x => x.nivel === "error");
  if (errs.length && !confirm(errs.length + " errores de contenido. ¿Guardar de todos modos?")) return;
  for (const k of ["cartas", "cinematicas"]) if (sucio[k]) { await api("/api/guardar", { archivo: k, datos: k === "cartas" ? D : CI }); sucio[k] = false; }
  estado();
}
$("#bGuardar").onclick = guardar;
$("#bBuild").onclick = async () => {
  if (sucio.cartas || sucio.cinematicas) { if (!confirm("Hay cambios sin guardar. ¿Guardar y luego hacer el build?")) return; await guardar(); }
  if (!confirm("Cierra el proyecto en GDevelop (o recárgalo después). ¿Generar game.json ahora?")) return;
  $("#bBuild").disabled = true; $("#estado").textContent = "build…";
  try { const r = await api("/api/build", {}); alert((r.ok ? "Build correcto.\n\n" : "El build falló.\n\n") + r.out.trim().split("\n").slice(-6).join("\n")); }
  finally { $("#bBuild").disabled = false; estado(); }
};

// ======================= CARTAS =======================
const C_BASE = ["id", "pj", "texto", "izq", "der", "arriba", "peso", "unica", "solo_luego", "cine"];
const O_BASE = ["t", "e"];
const filtrosC = new Set();
let indice = null;   // banderas -> cartas que las ponen / leen; luego -> quien encola
function indexar() {
  const pone = {}, lee = {}, encola = {};
  const add = (m, k, id) => { (m[k] = m[k] || []).includes(id) || m[k].push(id); };
  const ver = (o, id) => {
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o)) return o.forEach(x => ver(x, id));
    for (const k in o) {
      if (/(^|_)set$/.test(k)) [].concat(o[k]).forEach(f => add(pone, f, id));
      else if (k === "req" || k === "noreq") [].concat(o[k]).forEach(f => add(lee, f, id));
      else if (k === "luego") [].concat(o[k]).forEach(l => l && l.carta && add(encola, l.carta, id));
      else ver(o[k], id);
    }
  };

  g2.append(h("div", { class: "caja" }, h("h3", null, "Menos vistas"), h("div", { class: "ids" }, orden.filter(x => x[1] > 0).slice(-24).reverse().map(x => h("span", null, lk(x[0]), h("span", { style: "color:var(--txt3);margin-right:10px" }, x[1]))))));
  out.append(g2);
}
$("#bBot").addEventListener("change", pintarBalance);
$("#bCorrer").onclick = async () => {
  if (sucio.cartas && !confirm("La simulación usa las cartas GUARDADAS en disco. Hay cambios sin guardar. ¿Correr de todos modos?")) return;
  const b = $("#bCorrer"); b.disabled = true; const n = +$("#bN").value; b.textContent = "Simulando " + n + " × 6 bots…";
  try { const r = await api("/api/balance", { n }); if (!r.ok) alert("Falló:\n" + r.out); else { BAL = r.reporte; BAL.temporal = !r.oficial; pintarBalance(); } }
  finally { b.disabled = false; b.textContent = "Correr simulación"; }
};
$("#bSim").onclick = async () => { const b = $("#bSim"); b.disabled = true; try { const r = await api("/api/sim", { semilla: 7, frames: 20000 }); alert((r.code ? "FALLÓ\n\n" : "OK\n\n") + r.out.trim().split("\n").slice(-4).join("\n")); } finally { b.disabled = false; } };
